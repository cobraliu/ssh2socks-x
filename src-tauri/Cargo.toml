[package]
name = "ssh2socks"
version = "0.7.0"
description = "跨平台的 SSH -> SOCKS5 代理可视化管理工具"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
ssh-key = { version = "0.6", features = ["crypto", "encryption", "getrandom"] }
rsa = "0.9"
ed25519-dalek = "2"
curve25519-dalek = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
codepage = "0.1"
encoding_rs = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# RSA key generation is unbearably slow unoptimized; keep tests quick.
[profile.dev.package.num-bigint-dig]
opt-level = 3
